[package]
name = "bzd-users"
edition = "2024"

[workspace]
resolver = "3"
members = ["lib/api", "lib/migration"]

[dependencies]
bzd-users-api = { path = "lib/api" }
bzd-lib = { git = "https://github.com/bez-dna/bzd-lib.git" }

axum = "0.8.9"

tokio = { version = "1.52.3", features = ["full"] }

tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"

serde = "1.0.228"
serde_json = "1.0.150"

sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "mock",
] }

reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

async-nats = "0.49.1"

config = { version = "0.15.25", default-features = false, features = ["toml"] }
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["v7"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
rand = "0.10.2"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
chrono = "0.4.45"
random_color = "1.1.0"
async-trait = "0.1.89"
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
hex-literal = "1.1.0"
mockall = "0.15.0"
