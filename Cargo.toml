[package]
name = "bzd-users"
edition = "2024"

[workspace]
resolver = "3"
members = ["lib/api", "lib/migration"]

[dependencies]
bzd-users-api = { path = "lib/api" }
bzd-lib = { git = "https://github.com/bez-dna/bzd-lib.git" }

# tokio & server
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }

# grpc & proto
tonic = "0.14.6"
tonic-health = "0.14.6"
tonic-reflection = "0.14.6"

# serde
serde = "1.0.228"
serde_json = "1.0.150"
serde_with = { version = "3.21.0", features = ["base64"] }

# db
sea-orm = { version = "1.1.20", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "mock",
] }

# async
async-nats = "0.49.1"

# auth
coset = "0.4.2"
sha2 = "0.11.0"
p256 = "0.14.0"
ecdsa = { version = "0.17.0", features = ["der"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
regex = "1.13.0"
rand = "0.10.2"
base64 = "0.22.1"
serde_cbor_2 = "0.13.0"
url = "2.5.8"

# other
config = { version = "0.15.25", default-features = false, features = ["toml"] }
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["v7"] }
validator = { version = "0.20.0", features = ["derive"] }
thiserror = "2.0.18"
chrono = "0.4.45"
random_color = "1.1.0"
async-trait = "0.1.89"
